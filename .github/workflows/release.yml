name: Release

# Builds downloadable Linux + Windows versions of delve.
#
#   - push a tag like v0.1.0  -> builds and publishes a GitHub Release
#   - run manually (Actions tab -> Release -> Run workflow) -> builds
#     and attaches the files to that run, without publishing a release
#
# Requires export_presets.cfg to be committed (it is).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.6.3

jobs:
  build:
    name: Export ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            preset: Linux
            out: delve.x86_64
            dir: linux
          - name: Windows
            preset: Windows
            out: delve.exe
            dir: windows
          # macOS exports as a .zip containing delve.app. It is
          # UNSIGNED (signing needs an Apple developer account), so
          # Gatekeeper will complain on first launch — the release
          # notes tell people how to get past it.
          - name: macOS
            preset: macOS
            out: delve.zip
            dir: macos

    steps:
      - uses: actions/checkout@v4

      - name: Install Godot ${{ env.GODOT_VERSION }} + export templates
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"

          curl -fL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

          curl -fL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz
          # Templates must sit in a version-named folder Godot looks in.
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

          godot --version

      - name: Check the version matches the tag, and stamp the bundles
        # The top-right watermark (STO-UI-007) reads
        # application/config/version. If that drifts from the tag, every
        # download confidently displays the wrong version - which is
        # worse than showing none, because people would trust it.
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          IN_GAME=$(sed -n 's/^config\/version="\(.*\)"$/\1/p' project.godot)
          echo "tag=$TAG  project.godot=$IN_GAME"
          if [ -z "$IN_GAME" ]; then
            echo "::error::project.godot has no application/config/version"
            exit 1
          fi
          if [ "$TAG" != "$IN_GAME" ]; then
            echo "::error::version mismatch: tag v$TAG but project.godot says $IN_GAME"
            exit 1
          fi

          # Stamp the TAG into the bundle metadata rather than trusting
          # whatever is committed (STO-TOOLS-010). These fields decide
          # what macOS Get Info and the Windows exe properties report,
          # and they sat empty for the project's whole life - so every
          # download claimed to be Godot's default 1.0.0. Deriving them
          # here means they cannot go stale again: there is nothing to
          # remember to bump.
          sed -i \
            -e "s|^application/short_version=.*|application/short_version=\"$TAG\"|" \
            -e "s|^application/version=.*|application/version=\"$TAG\"|" \
            -e "s|^application/file_version=.*|application/file_version=\"$TAG\"|" \
            -e "s|^application/product_version=.*|application/product_version=\"$TAG\"|" \
            export_presets.cfg
          echo "bundle metadata stamped as $TAG:"
          grep -E "^application/(short_version|version|file_version|product_version)=" export_presets.cfg

      - name: Import assets
        # First run builds the .godot import cache. Godot exits non-zero
        # on some import warnings, which are not failures for us.
        run: godot --headless --import || true

      - name: Export ${{ matrix.name }}
        run: |
          set -euo pipefail
          mkdir -p "build/${{ matrix.dir }}"
          godot --headless --export-release "${{ matrix.preset }}" \
            "build/${{ matrix.dir }}/${{ matrix.out }}"
          ls -la "build/${{ matrix.dir }}"
          # An export can "succeed" while producing nothing useful.
          test -s "build/${{ matrix.dir }}/${{ matrix.out }}"

      - name: Package
        run: |
          cd "build/${{ matrix.dir }}"
          chmod +x delve.x86_64 2>/dev/null || true
          if [ "${{ matrix.dir }}" = "macos" ]; then
            # Godot already produced a .zip of the .app — don't nest
            # a zip inside a zip.
            cp delve.zip "../../delve-macos.zip"
          else
            zip -r "../../delve-${{ matrix.dir }}.zip" .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: delve-${{ matrix.dir }}
          path: delve-${{ matrix.dir }}.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Needed for scripts/make_manifest.py — the release job does not
      # otherwise have the repo.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist

      # A machine-readable description of this build, so an installer
      # can decide whether it already has this version, fetch the right
      # file for its platform, verify it, and know what to run.
      # Contract: README.md -> "Deployment bundle".
      - name: Write manifest
        run: |
          set -euo pipefail
          mkdir -p out
          find dist -name '*.zip' -exec cp {} out/ ';'
          python3 scripts/make_manifest.py "${GITHUB_REF_NAME#v}" out

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.zip
            out/manifest.json
          generate_release_notes: true
          body: |
            Download the zip for your machine, unzip it, and run **delve**.

            **To play together:** one person presses **Host**, everyone
            else types that person's IP address into the box and presses
            **Join**. Servers you join are remembered for next time.

            Both players must be on the same network, or the host must
            forward UDP port **7777**.

            ---

            **On macOS**, the app is unsigned, so the first launch is
            blocked. Either right-click `Delve.app` → **Open** → **Open**,
            or run this once in Terminal:

            ```
            xattr -cr /path/to/Delve.app
            ```
